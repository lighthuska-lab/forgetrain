[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "forgetrain-local"
version = "0.1.0"
description = "Declarative training plan validation and CPU admission primitives."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [{name = "Light Huska", email = "lighthuska@gmail.com"}]

[tool.hatch.build.targets.wheel]
packages = ["src/forgetrain"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
